<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLSNHS · Enrollment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../admin/css/enrollment.css" />
</head>
<body>
    <div class="enroll-container">
        <a href="homepage.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <div class="brand-center">
            <div class="brand-icon">P</div>
            <div class="brand-name">PLSNHS</div>
        </div>
        <div class="enroll-header">
            <h1>📝 Enrollment Form</h1>
            <p>Fill out the form to start your enrollment</p>
        </div>
        <form id="enrollForm">
            <div class="form-group">
                <label for="enrollName">Full Name</label>
                <input type="text" id="enrollName" placeholder="" required />
            </div>
            <div class="form-group">
                <label for="enrollEmail">Email Address</label>
                <input type="email" id="enrollEmail" placeholder="" required />
            </div>
            <div class="form-group">
                <label for="enrollPhone">Phone Number</label>
                <input type="tel" id="enrollPhone" placeholder="" required />
            </div>
            <div class="form-group">
                <label for="enrollGrade">Grade Level</label>
                <select id="enrollGrade" required>
                    <option value="">Select Grade Level</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-check"></i> Submit Enrollment
            </button>
        </form>
        <div class="demo-note">Demo: Any details will work</div>
    </div>
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script type="module" src="../admin/js/enrollment.js"></script>
</body>
</html>
